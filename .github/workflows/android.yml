name: Build Sutra Speed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the test dependency
        run: npm install jsdom --no-save

      - name: Check every drill generator against brute force
        run: node tools/test_drills.js

      - name: Drive every screen in a headless browser
        run: node tools/test_app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes 'tools', which Google retired; asking
          # for it makes sdkmanager exit 1 and kills the job. Name what the build needs instead.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle 8.7
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Show the environment
        run: |
          echo "--- java ---";   java -version
          echo "--- gradle ---"; gradle --version
          echo "--- sdk ---";    echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true
          echo "--- files ---";  ls -R app/src/main | head -40

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sutra-speed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the reports if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
