name: Build Sutra Speed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  test:
    name: Test the app logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the test dependency
        run: npm install jsdom --no-save

      - name: Check every drill generator against brute force
        run: node tools/test_drills.js

      - name: Drive every screen in a headless browser
        run: node tools/test_app.js

  build:
    name: Build the APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Without this the action only configures caching and expects a Gradle wrapper in
          # the repo, so the `gradle` command below is not on PATH. Pinning the version also
          # keeps Gradle compatible with AGP 8.5.2 and Kotlin 1.9.24.
          gradle-version: '8.7'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sutra-speed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The release job below only does anything once the four signing secrets exist.
      # Until then the debug APK above is the one to install for testing.
      - name: Check whether signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "HAVE_KEYSTORE=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> $GITHUB_ENV

      - name: Restore the signing keystore
        if: github.event_name == 'release' && env.HAVE_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release bundle and APK
        if: github.event_name == 'release' && env.HAVE_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload the release build
        if: github.event_name == 'release' && env.HAVE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sutra-speed-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
