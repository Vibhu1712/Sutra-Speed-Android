<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sutra Speed</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="hdr">
  <div class="hrow">
    <button id="hBack" class="iconbtn hide" aria-label="Back">&#8249;</button>
    <div class="hgrow">
      <h1 id="hTitle">Sutra Speed</h1>
      <div class="hsub" id="hSub"></div>
    </div>
    <span class="pill light" id="hPill"></span>
  </div>
</header>

<main id="main"></main>

<nav id="nav">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="learn"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Learn</button>
  <button data-go="practice"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Practice</button>
  <button data-go="exams"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>Exams</button>
  <button data-go="progress"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V5"/><path d="M19 20v-6"/></svg>Progress</button>
</nav>

<script src="drills.js"></script>
<script src="app.js"></script>
</body>
</html>
